[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viirr-retrieval"
version = "0.2.0"
description = "Leakage-safe retrieval baselines for VietIrrDocBench"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "numpy",
  "psycopg[binary]>=3.2,<4",
  "rank-bm25",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8"]
corpus = ["beautifulsoup4", "PyMuPDF", "pypdf", "requests"]
research = [
  "pytest>=8",
  "scipy",
  "sentence-transformers",
  "torch",
  "transformers",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
vietirr-api = "viirr_api.app:main"
